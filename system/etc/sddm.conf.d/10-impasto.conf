# User pictures, read by both the greeter and the shell's lock screen. Not in
# $HOME (sddm cannot read a 0700 home) and not in /usr/share/sddm/faces, which
# belongs to sddm. `./setup system` creates the directory; the pictures
# themselves are not part of the repository.

# The battery ring reads /sys/class/power_supply directly, since the greeter
# has no UPower. Qt 6 silently refuses local files to XMLHttpRequest unless
# this is set. GreeterEnvironment is a single key: a later file in
# /etc/sddm.conf.d/ that sets it replaces this line.
[General]
GreeterEnvironment=QML_XHR_ALLOW_FILE_READ=1

[Theme]
FacesDir=/var/lib/impasto/faces
