# Only the keys that differ from btop's defaults.


# ── THEME ───────────────────────────────────────────────────────────────────

# A name, not a path: btop only looks in ~/.config/btop/themes and
# /usr/[local/]share/btop/themes, and silently falls back to Default when given
# a path. theme_manager.py writes impasto.theme there on every palette push.
color_theme = "impasto"

# Draw on kitty's translucent background instead of painting over it.
theme_background = false


# ── SAVE ────────────────────────────────────────────────────────────────────

# Otherwise btop rewrites this file with every key it knows when it quits.
save_config_on_exit = false
