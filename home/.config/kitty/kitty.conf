# ╭──────────────────────────────────────────────────────────────────────────╮
# │                                                                          │
# │   K I T T Y                                                              │
# │   terminal emulator · window, cursor and palette                         │
# │                                                                          │
# │   github.com/andreumassanet/impasto                                      │
# │                                                                          │
# ╰──────────────────────────────────────────────────────────────────────────╯


# ── FONT ────────────────────────────────────────────────────────────────────

# A Nerd Font: the prompt uses its glyphs.
font_family JetBrainsMono Nerd Font Mono


# ── WINDOW ──────────────────────────────────────────────────────────────────

# Herdr owns the terminal session and starts its panes with Fish.
shell herdr

# Enough to show the blurred wallpaper without its texture showing through
# the text.
background_opacity 0.90

# Keeps the first cell clear of the rounded window corner.
window_padding_width 8

confirm_os_window_close 0


# ── REMOTE CONTROL ──────────────────────────────────────────────────────────

# theme_manager.py pushes palette changes to running terminals through these
# sockets. socket-only refuses the escape-sequence route, but any process
# running as this user can still reach the socket.
#
# A path rather than an abstract socket: kitty appends -<pid>, and a path can
# be globbed (kitty.sock-*). $XDG_RUNTIME_DIR is private tmpfs.
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty.sock


# ── CURSOR ──────────────────────────────────────────────────────────────────

cursor_shape block
cursor_trail 10
cursor_trail_start_threshold 0
cursor_trail_decay 0.01 0.05

# · blinking follows the system (cursor_blink_interval -1, the default)


# ── SCROLLBACK ──────────────────────────────────────────────────────────────

scrollback_lines 10000

# ctrl+shift+h opens the scrollback in scrollback_pager, `less` by default.


# ── TERMINAL BELL ───────────────────────────────────────────────────────────

enable_audio_bell no


# ── COLORS ──────────────────────────────────────────────────────────────────

# Fallback palette. The shell's palettes have eight colours, not sixteen, so
# the generated fragment at the end overrides only the slots it has a source
# for; the rest stay as written here.


# · interface
#
# The background is overridden by the fragment (a near-black tinted with the
# accent); pure black is what you get before the first push.
background            #000000
foreground            #dddddd
# White under every palette, so it stays easy to find.
cursor                #ffffff
selection_background  #56b6c2
selection_foreground  #000000


# · tabs
active_tab_background   #56b6c2
active_tab_foreground   #000000
inactive_tab_background #000000
inactive_tab_foreground #dddddd


# · normal
#
# color1, color4 and color5 are below 4.5:1 on the background; the prompt
# uses the bright variants.
color0 #4c4c4c
color1 #bb0000
color2 #5ede8f
color3 #f2f067
color4 #266ad7
color5 #bb00bb
color6 #00d9df
color7 #bbbbbb


# · bright
color8  #545454
color9  #ff5555
color10 #55ff55
color11 #ffff55
color12 #5555ff
color13 #ff55ff
color14 #55ffff
color15 #ffffff


# ── PALETTE ─────────────────────────────────────────────────────────────────

# Generated by scripts/theme_manager.py on every palette change, and pushed to
# open windows. Sets the four status hues, the text greys, and the accent on
# the cursor, selection, tab bar and cyan (the ANSI slot with no standing
# meaning). Black, magenta and the background keep the values above. A missing
# file only logs a warning.
include ~/.local/state/quickshell/kitty-palette.conf

# The shell's monospace font, written by the same script.
include ~/.local/state/quickshell/kitty-font.conf
