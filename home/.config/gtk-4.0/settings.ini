# libadwaita ignores gtk-theme-name; it reads named colours, which
# theme_manager.py writes into gtk.css beside this file (generated, not in the
# repository). Dark mode comes from the dconf color-scheme key (see README).

# `impasto` is generated by the palette push: Papirus with the folder colour
# nearest the accent. `./setup install` seeds it.

[Settings]
gtk-theme-name=Adwaita
gtk-icon-theme-name=impasto
gtk-cursor-theme-name=default
gtk-cursor-theme-size=24
