name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua and Fish
        run: sudo apt-get update && sudo apt-get install -y lua5.4 fish

      - name: Verify Python, Lua, Fish, Bash, JSON and TOML syntax
        run: ./setup check
