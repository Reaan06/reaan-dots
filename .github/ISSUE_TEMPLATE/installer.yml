name: Installer improvement
description: Suggest an improvement to the curl or bootstrap installer
title: "[Installer]: "
labels:
  - enhancement
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should the installer make possible?
    validations:
      required: true
  - type: textarea
    id: current_behavior
    attributes:
      label: Current behavior
      description: What happens today, including any error or limitation?
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed solution
      description: How should the installer or distribution experience change?
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Verification and acceptance criteria
      description: How can we verify that this improvement works?
    validations:
      required: true
